# ============================================================================
#  Laptop deal bot: configuration
#  Lives on the server at ~/Desktop/lappy/config.yaml. The next run (every 30 min) uses it.
# ============================================================================

# ---------------------------------------------------------------------------
# Your budget
# ---------------------------------------------------------------------------
budget:
  max_price: 150000        # alerts only fire at or below this price (or a watchlist target_price)
  track_min_price: 75000   # laptops tracked on the dashboard: from this price...
  track_max_price: 200000  # ...up to this. Tracking above budget lets the bot catch a ₹1.7L laptop dropping into budget.

# ---------------------------------------------------------------------------
# Your minimum specs (checked on every laptop the bot finds)
#   CPU: Intel i7/i9 13th gen or newer, Core Ultra 7/9, Core 7/9 2xxH,
#        Ryzen 7/9 250/260, 7840HS+, 8845HS, Ryzen AI 7/9, Ryzen 9000.
#        Rejected: i5/Core 5, i7 12th gen and older, Ryzen 7 7445HS/7735HS/170.
# ---------------------------------------------------------------------------
specs:
  gpus: ["5050", "4060", "5060", "4070", "5070", "4080", "5080", "4090", "5090"]
  min_ram_gb: 16
  min_ssd_gb: 512
  require_cpu: true

# ---------------------------------------------------------------------------
